<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Brittney's Life Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a quiet side rail of sections (bottom strip on phones) beside one working page; the day is the home page, everything else hangs off it. Every neutral leans toward the chosen accent hue (--h). */
:root{
  --h:205;
  --bg:oklch(0.972 0.008 var(--h)); --surface:oklch(0.995 0.003 var(--h)); --sunk:oklch(0.945 0.012 var(--h));
  --line:oklch(0.88 0.015 var(--h)); --fg:oklch(0.25 0.02 var(--h)); --muted:oklch(0.48 0.02 var(--h));
  --accent:oklch(0.48 0.12 var(--h)); --accent-fg:oklch(0.99 0.005 var(--h)); --accent-soft:oklch(0.92 0.045 var(--h));
  --warn:oklch(0.52 0.15 45); --good:oklch(0.50 0.12 150);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:oklch(0.19 0.012 var(--h)); --surface:oklch(0.235 0.014 var(--h)); --sunk:oklch(0.165 0.012 var(--h));
  --line:oklch(0.33 0.018 var(--h)); --fg:oklch(0.93 0.01 var(--h)); --muted:oklch(0.72 0.02 var(--h));
  --accent:oklch(0.78 0.11 var(--h)); --accent-fg:oklch(0.18 0.02 var(--h)); --accent-soft:oklch(0.32 0.05 var(--h));
  --warn:oklch(0.78 0.13 60); --good:oklch(0.78 0.12 150); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:oklch(0.19 0.012 var(--h)); --surface:oklch(0.235 0.014 var(--h)); --sunk:oklch(0.165 0.012 var(--h));
  --line:oklch(0.33 0.018 var(--h)); --fg:oklch(0.93 0.01 var(--h)); --muted:oklch(0.72 0.02 var(--h));
  --accent:oklch(0.78 0.11 var(--h)); --accent-fg:oklch(0.18 0.02 var(--h)); --accent-soft:oklch(0.32 0.05 var(--h));
  --warn:oklch(0.78 0.13 60); --good:oklch(0.78 0.12 150); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:700;line-height:1.1}
h2{font-size:1.02rem;font-weight:700}
h3{font-size:.95rem;font-weight:500}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:block}
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;min-width:0;max-width:1180px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .brand,.nav .sync{display:none}
.nav button{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.topsync{display:flex;justify-content:flex-end;margin-bottom:6px}
@media (min-width:880px){
  .shell{display:grid;grid-template-columns:210px minmax(0,1fr)}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));flex-direction:column;border-top:0;border-right:1px solid var(--line);
    padding:22px 12px 16px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;overflow-x:hidden;align-self:start}
  .nav .brand{display:block;font-family:var(--display);font-weight:700;font-size:1.15rem;padding:0 12px 14px}
  .nav button{text-align:left;border-radius:10px}
  .nav .sync{display:block;margin-top:auto;padding:12px 12px 0}
  .topsync{display:none}
  .main{padding-block:26px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface);white-space:nowrap}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.dot.warn::before{background:var(--warn)}
.tag{font-size:.74rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag.warn{color:var(--warn)}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.head .tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px;min-height:32px}
.btn.ghost:hover{color:var(--fg)}
.btn.small{padding:4px 9px;min-height:30px;font-size:.85rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-height:38px;min-width:0;font-size:16px}
@media (min-width:880px){input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font-size:15px}}
textarea{width:100%;resize:vertical;line-height:1.5}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
input[type=range]{accent-color:var(--accent);width:100%}
.plain{border-color:transparent!important;background:transparent!important;padding-left:0!important}
.plain:hover,.plain:focus{border-color:var(--line)!important;background:var(--surface)!important;padding-left:10px!important}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);min-width:0}
.list .row:first-child{border-top:0}
.row .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.row .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.row.done .txt>span:first-child{text-decoration:line-through;color:var(--muted)}
.row .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;width:68px;flex:none}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 6px;border-radius:6px;flex:none}
.x:hover{color:var(--warn);background:var(--sunk)}
.star{border:0;background:transparent;cursor:pointer;color:var(--line);font-size:1.05rem;padding:2px 4px;flex:none}
.star[aria-pressed="true"]{color:var(--accent)}
.empty{color:var(--muted);font-size:.9rem;padding:4px 0}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form .grow{flex:1 1 180px}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:14px}

.picks{display:flex;gap:5px;flex-wrap:wrap}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;min-height:34px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0 8px}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:.8rem;color:var(--muted);font-weight:500}
.pair{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .dow{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:62px;padding:5px 6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cell.out{background:transparent;color:var(--muted)}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .n{font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap}
.cell .d{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cell .d.t{background:var(--muted)}
.cell .ti{display:none;font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
@media (min-width:760px){.cell{min-height:96px}.cell .ti{display:block}.cell .dots{display:none}}
.week{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}

.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.sq{flex:none;width:26px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.68rem;color:var(--muted);padding:0}
.sq.off{border-style:dashed;opacity:.6}
.sq[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.spark{width:100%;height:auto;display:block}
.meals{display:grid;grid-template-columns:1fr;gap:6px}
.meals .day{font-weight:600;font-size:.85rem;padding-top:6px}
@media (min-width:620px){.meals{grid-template-columns:96px repeat(3,minmax(0,1fr));align-items:center}.meals .day{padding-top:0}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px oklch(0 0 0 / .25)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
@media (min-width:880px){.toast{bottom:24px}}
.note{font-size:.85rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
</style>
</head>
<body>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main class="main" id="main"></main>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,attrs){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')e.className=v; else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v; else if(k==='checked')e.checked=!!v; else e.setAttribute(k,v===true?'':v);}
  const kids=Array.prototype.slice.call(arguments,2).flat(Infinity);
  for(const c of kids){ if(c==null||c===false||c==='')continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clone=o=>JSON.parse(JSON.stringify(o));
function stable(o){ if(Array.isArray(o))return '['+o.map(stable).join(',')+']';
  if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
  return JSON.stringify(o===undefined?null:o); }
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmt=(s,o)=>pd(s).toLocaleDateString(undefined,o);
const fmtLong=s=>fmt(s,{weekday:'long',month:'long',day:'numeric'});
const fmtShort=s=>fmt(s,{month:'short',day:'numeric'});
const fmtDow=s=>fmt(s,{weekday:'short'});
function fmtTime(t){ if(!t)return 'All day'; const p=t.split(':').map(Number); const ap=p[0]>=12?'PM':'AM'; const hr=p[0]%12||12; return hr+':'+pad(p[1])+' '+ap; }
function weekStart(s){const d=pd(s);const ws=S.settings.weekStart?1:0;const back=(d.getDay()-ws+7)%7;d.setDate(d.getDate()-back);return iso(d);}

/* ---------- state ---------- */
const SECTIONS=['tasks','events','habits','wellness','food','goals','notes','home','lists','trips','settings'];
const defaults={
  tasks:()=>({items:[]}), events:()=>({items:[]}), habits:()=>({items:[],log:{}}), wellness:()=>({log:{}}),
  food:()=>({meals:{},grocery:[],pantry:[],recipes:[]}), goals:()=>({items:[]}), notes:()=>({pages:[]}),
  home:()=>({jobs:[]}),
  lists:()=>({cols:[{id:'books',n:'Books',items:[]},{id:'films',n:'Films & shows',items:[]},{id:'gifts',n:'Gift ideas',items:[]},{id:'places',n:'Places to go',items:[]}]}),
  trips:()=>({items:[]}), settings:()=>({theme:'auto',hue:205,weekStart:1,hide:{}})
};
const S={}; SECTIONS.forEach(k=>S[k]=defaults[k]());
const ui={view:'today',date:today(),planMode:'month',anchor:today(),foodWeek:today(),noteId:null,listId:null,tripId:null,qaKind:'task'};
let mode='local', ready=false, stale=false, col=null, saving=0, saveErr='';
const dirtyVer={}, flushedVer={}, writing={}, timers={};
SECTIONS.forEach(k=>{dirtyVer[k]=0;flushedVer[k]=0;});
const isDirty=k=>dirtyVer[k]!==flushedVer[k]||writing[k];

function lsGet(k){try{const v=localStorage.getItem('lp:'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem('lp:'+k,JSON.stringify(v));}catch(e){}}
function loadLocal(){SECTIONS.forEach(k=>{const v=lsGet(k); if(v)S[k]=Object.assign(defaults[k](),v);});}

function save(k){
  dirtyVer[k]++; lsSet(k,S[k]);
  if(k==='settings')applyLook();
  if(mode!=='sync'||!col){flushedVer[k]=dirtyVer[k];return;}
  clearTimeout(timers[k]); timers[k]=setTimeout(()=>flush(k),700); paintSync();
}
function flush(k){
  if(mode!=='sync'||!col){flushedVer[k]=dirtyVer[k];return;}
  /* Firestore queues writes in order and keeps them while offline, so this does not wait for the server. */
  flushedVer[k]=dirtyVer[k];
  col.doc(k).set(clone(S[k])).then(()=>{if(saveErr){saveErr='';paintSync();}}).catch(e=>{saveErr=(e&&e.code)||'unavailable';paintSync();});
  paintSync();
}
function syncLabel(){
  if(mode==='local')return ['Saved on this device',false];
  if(mode==='signedout')return ['Sign in to sync',true];
  if(mode==='connecting')return ['Connecting',false];
  if(mode==='failed')return ['Sync unavailable, saved on this device',true];
  if(saveErr==='permission-denied')return ['Sync blocked, check database rules',true];
  if(saveErr)return ['Could not sync, saved on this device',true];
  if(SECTIONS.some(k=>dirtyVer[k]!==flushedVer[k]))return ['Saving',false];
  if(stale)return ['Offline, saved on this device',true];
  return ['Synced',false];
}

/* ---------- sync (optional, Firebase) ---------- */
/* Paste your Firebase web config between the braces to have sync ready on every device, or paste it on the Setup page instead.
   Example: const FIREBASE_CONFIG = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." }; */
const FIREBASE_CONFIG = null;
let fb=null, unsub=null, userEmail='', authMsg='';
function parseCfg(txt){
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}'); if(a<0||b<a)return null;
  let s=txt.slice(a,b+1).replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/,\s*}/g,'}').replace(/'/g,'"');
  try{const o=JSON.parse(s);return o&&o.apiKey&&o.projectId?o:null;}catch(e){return null;}
}
function getCfg(){ if(FIREBASE_CONFIG)return FIREBASE_CONFIG; try{const v=localStorage.getItem('lp:fbcfg');return v?JSON.parse(v):null;}catch(e){return null;} }
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.append(s);});}
async function startSync(){
  const cfg=getCfg(); if(!cfg)return;
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(base+'firebase-app-compat.js'); await loadScript(base+'firebase-auth-compat.js'); await loadScript(base+'firebase-firestore-compat.js');
    window.firebase.initializeApp(cfg); const fs=window.firebase.firestore();
    try{await fs.enablePersistence({synchronizeTabs:true});}catch(e){}
    fb={auth:window.firebase.auth(),fs:fs};
    fb.auth.onAuthStateChanged(u=>{
      if(unsub){unsub();unsub=null;}
      if(!u){col=null;mode='signedout';userEmail='';render();return;}
      userEmail=u.email||'';col=fs.collection('users').doc(u.uid).collection('planner');mode='sync';stale=true;saveErr='';attach();render();});
  }catch(e){mode='failed';render();}
}
function attach(){
  let first=true;
  unsub=col.onSnapshot({includeMetadataChanges:true},snap=>{
    let changed=false;const seen={};
    snap.docs.forEach(d=>{const k=d.id;if(SECTIONS.indexOf(k)<0)return;seen[k]=1;if(isDirty(k)||d.metadata.hasPendingWrites)return;
      const data=d.data();if(!data||stable(data)===stable(S[k]))return;
      S[k]=Object.assign(defaults[k](),clone(data));lsSet(k,S[k]);changed=true;if(k==='settings')applyLook();});
    stale=snap.metadata.fromCache;
    if(!snap.metadata.fromCache&&first){first=false;
      /* First contact with the server: anything this device has that the account does not gets uploaded. */
      SECTIONS.forEach(k=>{if(!seen[k]&&stable(S[k])!==stable(defaults[k]()))save(k);});}
    if(changed)remoteRender();else paintSync();
  },err=>{saveErr=(err&&err.code)||'unavailable';render();});
}
function signIn(email,pw,create){
  if(!fb)return; authMsg='';
  const p=create?fb.auth.createUserWithEmailAndPassword(email,pw):fb.auth.signInWithEmailAndPassword(email,pw);
  p.catch(e=>{const c=(e&&e.code)||'';
    authMsg=c==='auth/email-already-in-use'?'That email already has an account. Use Sign in.':
      c==='auth/weak-password'?'Pick a password of at least 6 characters.':
      c==='auth/operation-not-allowed'?'Email/Password sign-in is not switched on in your Firebase project yet.':
      c==='auth/network-request-failed'?'No connection. Try again when you are online.':
      'That email and password did not work.';render();});
}

/* ---------- backup ---------- */
function exportBackup(){
  const data={app:'life-planner',exported:new Date().toISOString(),sections:{}};SECTIONS.forEach(k=>data.sections[k]=S[k]);
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  const a=h('a',{href:url,download:'life-planner-backup-'+today()+'.json'});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{let d=null;try{d=JSON.parse(r.result);}catch(e){}

/* ---------- domain logic ---------- */
function nextDate(d,rep){const x=pd(d);
  if(rep==='weekdays'){do x.setDate(x.getDate()+1); while(x.getDay()%6===0);}
  else if(rep==='weekly')x.setDate(x.getDate()+7); else if(rep==='biweekly')x.setDate(x.getDate()+14);
  else if(rep==='monthly')x.setMonth(x.getMonth()+1); else if(rep==='yearly')x.setFullYear(x.getFullYear()+1);
  else x.setDate(x.getDate()+1);
  return iso(x);}
function occurs(e,D){
  if(D<e.date)return false; if(!e.rep)return D===e.date;
  const a=pd(e.date),b=pd(D),diff=diffDays(e.date,D);
  switch(e.rep){case 'daily':return true; case 'weekdays':return b.getDay()%6!==0; case 'weekly':return diff%7===0;
    case 'biweekly':return diff%14===0; case 'monthly':return a.getDate()===b.getDate();
    case 'yearly':return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();} return false;
}
const eventsFor=D=>S.events.items.filter(e=>occurs(e,D)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
function tasksFor(D){const T=today();
  return S.tasks.items.filter(t=>{
    if(t.rep)return t.lastDone===D||t.date===D||(D===T&&t.date<D);
    if(t.done)return (t.doneOn||t.date)===D;
    return t.date===D||(D===T&&t.date<D);
  });}
const taskDone=(t,D)=>t.rep?t.lastDone===D:!!t.done;
function toggleTask(t,D){
  if(t.rep){ if(t.lastDone===D){t.date=t.prev||D;t.lastDone='';} else {t.prev=t.date;t.lastDone=D;let n=t.date;do{n=nextDate(n,t.rep);}while(n<=D);t.date=n;} }
  else {t.done=!t.done;t.doneOn=t.done?D:'';}
  save('tasks');render();
}
const REP={'':'Does not repeat',daily:'Every day',weekdays:'Weekdays',weekly:'Every week',biweekly:'Every 2 weeks',monthly:'Every month',yearly:'Every year'};
const HMODE={daily:'Every day',weekdays:'Weekdays',weekends:'Weekends',w1:'Once a week',w2:'2 times a week',w3:'3 times a week',w4:'4 times a week',w5:'5 times a week',w6:'6 times a week'};
const perWeek=hb=>hb.mode[0]==='w'&&hb.mode.length===2?Number(hb.mode[1]):0;
function scheduled(hb,D){const g=pd(D).getDay(); if(hb.mode==='weekdays')return g%6!==0; if(hb.mode==='weekends')return g%6===0; return true;}
const ticked=(id,D)=>(S.habits.log[D]||[]).indexOf(id)>=0;
function toggleHabit(id,D){const a=S.habits.log[D]||[];const i=a.indexOf(id); if(i>=0)a.splice(i,1); else a.push(id);
  if(a.length)S.habits.log[D]=a; else delete S.habits.log[D]; save('habits');render();}
function weekCount(hb,D){const ws=weekStart(D);let c=0;for(let i=0;i<7;i++)if(ticked(hb.id,addDays(ws,i)))c++;return c;}
function streak(hb){const T=today();let n=0;const per=perWeek(hb);
  if(per){let ws=weekStart(T);for(let w=0;w<60;w++){const c=weekCount(hb,ws);if(c>=per)n++;else if(w>0)break;ws=addDays(ws,-7);}return n+' wk';}
  for(let i=0;i<400;i++){const d=addDays(T,-i);if(!scheduled(hb,d))continue;if(ticked(hb.id,d))n++;else if(i>0)break;}
  return n+(n===1?' day':' days');}
function jobDue(j){const T=today(); if(!j.last)return true; const d=diffDays(j.last,T); return j.every==='daily'?d>=1:j.every==='weekly'?d>=7:d>=30;}

function spark(vals,lo,hi){

  const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','spark');svg.setAttribute('role','img');
  const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);svg.append(e);};
  [lo,(lo+hi)/2,hi].forEach(v=>mk('line',{x1:px,x2:W-px,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1,fill:'none'}));
  let d='',pen=false,last=-1;
  vals.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';pen=true;last=i;
    if((i===0||vals[i-1]==null)&&(i===n-1||vals[i+1]==null))mk('circle',{cx:X(i),cy:Y(v),r:2.2,fill:'var(--accent)'});});
  if(d)mk('path',{d:d.trim(),stroke:'var(--accent)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round',fill:'none'});
  if(last>=0)mk('circle',{cx:X(last),cy:Y(vals[last]),r:3.5,fill:'var(--accent)',stroke:'var(--surface)','stroke-width':1.5});
  return svg;
}

        h('div',{class:'pair'},h('span',{class:'lbl'},'Colour'),h('div',{class:'picks'},HUES.map(x=>h('button',{class:'sw',type:'button',style:'background:oklch(0.62 0.13 '+x[0]+')','aria-pressed':String((st.hue==null?205:st.hue)===x[0]),'aria-label':x[1],title:x[1],onclick:()=>{st.hue=x[0];save('settings');render();}}))))),
      card('Calendar','',h('div',{class:'pair'},h('span',{class:'lbl'},'Week starts on'),seg([[1,'Monday'],[0,'Sunday']],st.weekStart?1:0,v=>{st.weekStart=v;save('settings');render();}))),
      card('Day page cards','',h('div',{class:'list'},Object.keys(CARDS).map(k=>h('label',{class:'row'},h('input',{type:'checkbox',id:'hd-'+k,checked:!(st.hide||{})[k],onchange:e=>{st.hide=st.hide||{};if(e.target.checked)delete st.hide[k];else st.hide[k]=true;save('settings');}}),h('span',{class:'txt'},CARDS[k]))))),
      syncCard(s),
      card('Backup','',
        h('p',{class:'note'},'Download everything as one file, or restore from a file you saved earlier. Restoring replaces what is here.'),
        h('div',{class:'form'},h('button',{class:'btn',type:'button',onclick:exportBackup},'Download backup'),
          h('label',{class:'btn',for:'bk-file',style:'display:inline-flex;align-items:center'},'Restore from file'),
          h('input',{type:'file',id:'bk-file',accept:'application/json,.json',hidden:true,onchange:e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f);e.target.value='';}})))));
}
function syncCard(s){
  const chip=h('div',null,h('span',{class:'chip dot'+(s[1]?' warn':''),'data-sync':''},s[0]));
  if(!getCfg())return card('Sync between devices','',chip,
    h('p',{class:'note'},'Right now this planner lives in this browser only. To share it between phone and laptop, create a free Firebase project, then paste its web config here on each device.'),
    h('form',{class:'stack',style:'gap:8px',onsubmit:e=>{e.preventDefault();const c=parseCfg(e.target.elements.cfg.value);
        if(!c){toast('That does not look like a Firebase config. Copy the whole firebaseConfig block.');return;}
        try{localStorage.setItem('lp:fbcfg',JSON.stringify(c));}catch(err){toast('This browser would not save the config');return;}
        location.reload();}},
      h('textarea',{id:'fb-cfg',name:'cfg',rows:'5',placeholder:'const firebaseConfig = { apiKey: "...", ... };','aria-label':'Firebase config',spellcheck:'false'}),
      h('div',null,h('button',{class:'btn primary',type:'submit'},'Connect'))));
  if(mode==='sync')return card('Sync between devices','',chip,
    h('p',{class:'note'},'Signed in as '+(userEmail||'your account')+'. Changes save here first and sync when you are online.'),
    h('div',null,h('button',{class:'btn',type:'button',onclick:()=>{if(fb)fb.auth.signOut();}},'Sign out')));
  if(mode==='signedout')return card('Sync between devices','',chip,
    h('p',{class:'note'},'Use the same email and password on every device. The first time, choose Create account.'),
    h('form',{class:'stack',style:'gap:8px',onsubmit:e=>{e.preventDefault();signIn(e.target.elements.em.value.trim(),e.target.elements.pw.value,false);}},
      h('input',{type:'text',id:'au-em',name:'em',inputmode:'email',autocomplete:'username',placeholder:'Email','aria-label':'Email'}),
      h('input',{type:'password',id:'au-pw',name:'pw',autocomplete:'current-password',placeholder:'Password','aria-label':'Password',style:'border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-height:38px;font-size:16px'}),
      authMsg?h('p',{class:'note',style:'color:var(--warn)'},authMsg):null,
      h('div',{class:'form'},h('button',{class:'btn primary',type:'submit'},'Sign in'),
        h('button',{class:'btn',type:'button',onclick:e=>{const f=e.target.form;signIn(f.elements.em.value.trim(),f.elements.pw.value,true);}},'Create account'))));
  return card('Sync between devices','',chip,
    h('p',{class:'note'},mode==='failed'?'The sync service could not be loaded, so changes are staying on this device for now. Check the connection and reload.':'Connecting to your database.'),
    FIREBASE_CONFIG?null:h('div',null,h('button',{class:'btn ghost small',type:'button',onclick:()=>{try{localStorage.removeItem('lp:fbcfg');}catch(e){}location.reload();}},'Remove the saved config')));
}

/* ---------- shell ---------- */
const VIEWS=[['today','Today',vToday],['plan','Plan',vPlan],['habits','Habits',vHabits],['wellness','Wellness',vWellness],['food','Food',vFood],['goals','Goals',vGoals],['notes','Notebook',vNotes],['home','Home',vHome],['lists','Lists',vLists],['trips','Trips',vTrips],['setup','Setup',vSetup]];
let renderPending=false;
function render(){
  renderPending=false;
  const nav=$('#nav'),main=$('#main'),s=syncLabel();
  nav.replaceChildren(h('div',{class:'brand'},'Life Planner'),
    ...VIEWS.map(v=>h('button',{type:'button','aria-current':v[0]===ui.view?'page':null,onclick:()=>go(v[0])},v[1])),
    h('div',{class:'sync'},h('span',{class:'chip dot'+(s[1]?' warn':''),'data-sync':''},s[0])));
  const top=h('div',{class:'topsync'},h('span',{class:'chip dot'+(s[1]?' warn':''),'data-sync':''},s[0]));
  if(!ready){main.replaceChildren(top,h('div',{class:'head'},h('div',null,h('div',{class:'eyebrow'},'One moment'),h('h1',null,'Opening your planner'))),
    h('p',{class:'empty'},'Your day, habits, meals and lists will appear here as soon as your saved planner loads.'));return;}
  const v=VIEWS.find(x=>x[0]===ui.view)||VIEWS[0];
  main.replaceChildren(top,v[2]());
}
function remoteRender(){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'&&$('#main').contains(a)){renderPending=true;return;}
  render();
}
document.addEventListener('focusout',()=>{if(renderPending)setTimeout(()=>{if(renderPending)remoteRender();},150);});
function fromHash(){const k=(location.hash||'').replace('#','');if(VIEWS.some(v=>v[0]===k)&&k!==ui.view){ui.view=k;render();}}
window.addEventListener('hashchange',fromHash);

function init(){
  { const k=(location.hash||'').replace('#',''); if(VIEWS.some(v=>v[0]===k))ui.view=k; }
  loadLocal();ready=true;mode=getCfg()?'connecting':'local';applyLook();render();
  startSync();
}
init();
})();
</script>
